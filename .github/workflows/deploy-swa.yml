name: Deploy web app to Azure Static Web Apps

on:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "data/snapshots/dashboard-snapshot.json"
      - ".github/workflows/deploy-swa.yml"
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  build_and_deploy:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy
    steps:
      - uses: actions/checkout@v4

      - name: Bundle snapshot into web app
        # SWA serves the contents of app_location at the site root; the dashboard
        # snapshot lives outside apps/web in the repo, so copy it in before deploy.
        run: |
          mkdir -p apps/web/data/snapshots
          cp data/snapshots/dashboard-snapshot.json apps/web/data/snapshots/dashboard-snapshot.json

      - name: Deploy to Static Web App
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: "apps/web"
          api_location: ""
          output_location: ""
          skip_app_build: true

  close_pull_request:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close PR preview
    steps:
      - name: Close
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: close
